<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel privado</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070d18;color:#e8f1ff;font-family:system-ui;padding:20px}.box{width:min(100%,390px);padding:28px;background:#101d30;border:1px solid #49617c;border-radius:18px}input,button{width:100%;padding:14px;border-radius:10px;font-size:16px;margin-top:10px}input{background:#07101d;color:white;border:1px solid #49617c}button{background:#3ee0ff;border:0;font-weight:800;color:#031722}#msg{color:#ff9a9a}</style></head><body><form class="box" id="form"><h2>Panel privado</h2><p>Acceso exclusivo de administración.</p><input id="pass" type="password" placeholder="Contraseña privada" required><button>Entrar</button><div id="msg"></div></form><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/admin-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pass").value})});if(r.ok)location.href="/admin";else document.getElementById("msg").textContent="Contraseña incorrecta."});
</script></body></html>
