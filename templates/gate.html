<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#12334b,#050a14 70%);font-family:system-ui;color:#e5f4ff;padding:22px}.box{width:min(100%,380px);text-align:center;padding:30px 24px;border:1px solid #3ee0ff66;border-radius:22px;background:#071421dd}h1{font-size:23px}p{color:#a9bfd0}input,button{width:100%;padding:15px;border-radius:12px;font-size:17px}input{background:#020a12;color:#fff;border:1px solid #456174;text-align:center}button{margin-top:14px;border:0;background:#3ee0ff;color:#03202a;font-weight:800}#msg{min-height:24px;color:#ff9a9a}</style></head><body><form class="box" id="form"><h1>Acceder </h1><p>Introduce la clave para continuar.</p><input id="pass" type="password" inputmode="numeric" required><button>Entrar</button><div id="msg"></div></form><script>
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/api/entry-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pass").value})});if(r.ok)location.href="/";else document.getElementById("msg").textContent="La clave no es correcta."});
</script></body></html>
