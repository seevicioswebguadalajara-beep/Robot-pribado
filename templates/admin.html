<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Respuestas privadas</title><style>
*{box-sizing:border-box}body{margin:0;background:#070d18;color:#e8f1ff;font-family:system-ui;padding:20px}.wrap{max-width:850px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{margin:14px 0;padding:18px;border:1px solid #2b4662;background:#101d30;border-radius:14px}.date{color:#83dfff;font-size:13px}.answer{margin:9px 0;padding:10px;background:#081321;border-radius:8px;overflow-wrap:anywhere}.label{color:#8ca8c3;font-size:12px;text-transform:uppercase}.empty{color:#aabbd0;padding:30px;text-align:center}button{border:1px solid #49617c;background:#14243a;color:#e8f1ff;border-radius:9px;padding:10px 14px}</style></head><body><main class="wrap"><header><div><h2>Respuestas recibidas</h2><div class="date">Panel privado · Solo lectura</div></div><div><button onclick="load()">Actualizar</button> <button onclick="logout()">Cerrar sesión</button></div></header><section id="list"><div class="empty">Cargando…</div></section></main><script>
const list=document.getElementById("list");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){try{const r=await fetch("/api/admin/responses");if(r.status===401){location.href="/admin";return}const data=await r.json();if(!data.length){list.innerHTML='<div class="empty">Todavía no hay respuestas.</div>';return}list.innerHTML=data.map((x,i)=>'<article class="card"><div class="date">Respuesta #'+(data.length-i)+' · '+new Date(x.submitted_at).toLocaleString("es-MX")+'</div>'+x.answers.map((a,j)=>'<div class="answer"><div class="label">Posibilidad '+(j+1)+'</div>'+esc(a||"— Sin respuesta —")+'</div>').join("")+'</article>').join("")}catch(e){list.textContent="No se pudieron cargar las respuestas."}}
async function logout(){await fetch("/logout",{method:"POST"});location.href="/admin"}load();
</script></body></html>
